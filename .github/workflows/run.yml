
name: Run Energy News Agent (HTML Email)

on:
  schedule:
    - cron: "0 8 * * *"   # Every day 10:00 Greece (08:00 UTC)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip tooling
        run: python -m pip install --upgrade pip setuptools wheel

      - name: (Optional) Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Run Energy News (send HTML email)
        env:
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}  # Gmail App Password recommended
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_CC: ${{ secrets.EMAIL_CC }}              # optional
          EMAIL_BCC: ${{ secrets.EMAIL_BCC }}            # optional
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}        # e.g., smtp.gmail.com
          SMTP_PORT: ${{ secrets.SMTP_PORT }}            # e.g., 587
          SEND_EMPTY: ${{ secrets.SEND_EMPTY }}          # "true" or "false"
        run: python energy_news.py

name: Daily Energy News Agent

on:
  schedule:
    # 07:00 UTC  →  10:00 Athens (EEST, UTC+3, summer)
    #            →  09:00 Athens (EET,  UTC+2, winter)
    # Original was 08:00 UTC — shifted 1 h earlier so report arrives
    # by 10:00 Athens year-round regardless of DST.
    # Change to "0 8 * * 1-5" if you prefer weekdays-only at 11:00 EEST.
    - cron: "0 7 * * 1-5"   # Mon–Fri only; add "0 7 * * 0,6" for weekends

  workflow_dispatch:          # allow manual trigger from Actions tab

permissions:
  contents: read              # minimal permissions — script only reads repo

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # kill job if parallel fetches stall

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # 3.12 LTS; was 3.11

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Energy News Agent
        env:
          EMAIL_USERNAME:  ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}   # Gmail App Password
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_CC:        ${{ secrets.EMAIL_CC }}          # optional
          EMAIL_BCC:       ${{ secrets.EMAIL_BCC }}          # optional
          SMTP_SERVER:     ${{ secrets.SMTP_SERVER }}        # e.g. smtp.gmail.com
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}          # e.g. 587
          SEND_EMPTY:      ${{ secrets.SEND_EMPTY }}         # "true" / "false"
        run: python energy_news.py

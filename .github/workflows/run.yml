
name: Run Energy News Agent

on:
  schedule:
    - cron: "0 6 * * *"   # Κάθε μέρα 08:00 Ελλάδας (06:00 UTC)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install requirements
      run: |
        pip install -r requirements.txt

    - name: Run script
      env:
        EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        SMTP_SERVER: ${{ secrets.SMTP_SERVER }}   # προαιρετικό (π.χ. smtp.gmail.com)
        SMTP_PORT: ${{ secrets.SMTP_PORT }}       # προαιρετικό (π.χ. 587)
        SEND_EMPTY: ${{ secrets.SEND_EMPTY }}     # "true" ή "false"
      run: python energy_news.py

    - name: Upload PPTX artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: energy-news-report
        path: energy_news_report.pptx

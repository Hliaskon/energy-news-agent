name: Weekly Energy Digest

on:
  schedule:
    # Target: every Monday 09:00 Athens local time.
    # GitHub Actions cron is UTC-only and doesn't follow DST, so two entries
    # are needed to land on 09:00 Athens year-round; a guard step below skips
    # whichever of the two doesn't match the current Athens offset.
    - cron: "0 7 * * 1"   # 09:00 EET  (winter, UTC+2)
    - cron: "0 6 * * 1"   # 09:00 EEST (summer, UTC+3)
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Guard — check if it's 09:00 Athens time
        id: guard
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hour=$(TZ=Europe/Athens date +%H)
          if [ "$hour" = "09" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Athens local hour is $hour, not 09 — this is the other DST cron, skipping."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repo
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.11
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.11"

      - name: Install system XML libs (faster lxml)
        if: steps.guard.outputs.proceed == 'true'
        run: sudo apt-get install -y python3-lxml

      - name: Cache pip
        if: steps.guard.outputs.proceed == 'true'
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python requirements
        if: steps.guard.outputs.proceed == 'true'
        run: pip install -r requirements.txt

      - name: Run weekly digest
        if: steps.guard.outputs.proceed == 'true'
        env:
          EMAIL_USERNAME:  ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_CC:        ${{ secrets.EMAIL_CC }}
          EMAIL_BCC:       ${{ secrets.EMAIL_BCC }}
          SMTP_SERVER:     ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
          SEND_EMPTY:      ${{ secrets.SEND_EMPTY }}
        run: python weekly_digest.py

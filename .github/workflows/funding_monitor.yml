name: Funding Monitor

on:
  schedule:
    - cron: "0 7 * * *"   # Every day 07:00 UTC = 09:00 EET / 10:00 EEST
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Required so the workflow can commit state/seen_funding.json back to repo
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          # Use a PAT so the commit can trigger other workflows if needed
          # If you don't have a PAT, the default GITHUB_TOKEN also works
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system XML libs
        run: sudo apt-get install -y python3-lxml

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install Python requirements
        run: pip install -r requirements.txt

      - name: Run funding monitor
        env:
          EMAIL_USERNAME:  ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD:  ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
          EMAIL_CC:        ${{ secrets.EMAIL_CC }}
          EMAIL_BCC:       ${{ secrets.EMAIL_BCC }}
          SMTP_SERVER:     ${{ secrets.SMTP_SERVER }}
          SMTP_PORT:       ${{ secrets.SMTP_PORT }}
        run: python funding_monitor.py

      # Commit the updated seen_funding.json so next run knows what was already seen
      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen_funding.json
          git diff --staged --quiet || git commit -m "chore: update funding monitor state [skip ci]"
          git push
